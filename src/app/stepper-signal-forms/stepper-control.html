<div class="stepper">
  <button
    type="button"
    (click)="decrement()"
    [disabled]="disabled() || value() === 1"
    class="btn btn-minus">
    -
  </button>

  <span class="value">{{ value() }}</span>

  <button
    type="button"
    (click)="increment()"
    [disabled]="disabled() || value() === 10"
    class="btn btn-plus">
    +
  </button>

  <div>
    The number is {{ isEven() ? 'even' : 'odd' }}
  </div>

</div>
