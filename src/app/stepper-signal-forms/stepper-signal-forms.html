<form (ngSubmit)="onSubmit()">
  <div class="form-row">
    <label>
      Name:
      <input [field]="stepperForm.name" placeholder="Enter name">
    </label>
  </div>

  <div class="form-row">
    <label>
      Level:
      <app-stepper-control [field]="stepperForm.level"></app-stepper-control>
    </label>
  </div>

  <div class="form-row">
    <label>
      Score:
      <input type="number" [field]="stepperForm.score">
    </label>
  </div>

  <button type="submit" [disabled]="stepperForm().invalid()">Submit</button>

  <p>Form Value: {{ formData() | json }}</p>
  <p>Form Valid: {{ stepperForm().valid() }}</p>

  <button type="button" (click)="resetForm()">Reset</button>
  <button type="button" (click)="setLevel(7)">Set Level to 7</button>
</form>
